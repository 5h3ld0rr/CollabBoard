name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server test suite & coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-key' }}
        run: npm run test:coverage

      - name: Upload server coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: Backend/coverage/
          if-no-files-found: ignore

  client:
    name: Frontend Lint & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run frontend test suite & coverage
        run: npm run test:coverage --if-present

      - name: Upload client coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: Frontend/coverage/
          if-no-files-found: ignore
