openapi: 3.0.3
info:
  title: CollabBoard API
  description: >
    RESTful API specification for CollabBoard collaborative workspace and task management.
    Built for Session 2 Server-Side Technology workshop and assignment.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local Development Server

paths:
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                  timestamp:
                    type: string

  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@nsbm.lk
                password:
                  type: string
                  minLength: 6
                  example: password123
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /api/auth/login:
    post:
      summary: User authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user1@nsbm.lk
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login successful, returns JWT token and user profile
        '401':
          description: Invalid email or password
        '429':
          description: Too many login attempts

  /api/auth/me:
    get:
      summary: Get currently authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
        '401':
          description: Missing, invalid, or expired token

  /api/boards:
    get:
      summary: List boards accessible to requesting user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of accessible boards
    post:
      summary: Create a new board
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 3
                description:
                  type: string
                members:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Board created

  /api/boards/{id}:
    get:
      summary: Get specific board details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Board details
        '403':
          description: Forbidden access
        '404':
          description: Board not found
    patch:
      summary: Update board
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Board updated
    delete:
      summary: Delete board (Owner only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Board deleted

  /api/boards/{id}/tasks:
    get:
      summary: List tasks on a board
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, doing, done]
      responses:
        '200':
          description: List of tasks on board

  /api/tasks:
    get:
      summary: List and query tasks across accessible boards
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, doing, done]
        - name: assignee
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: -createdAt
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Filtered, sorted, and paginated task list
    post:
      summary: Create a new task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, boardId]
              properties:
                title:
                  type: string
                  minLength: 3
                boardId:
                  type: string
                status:
                  type: string
                  enum: [todo, doing, done]
                priority:
                  type: string
                  enum: [low, normal, high]
                assignee:
                  type: string
      responses:
        '201':
          description: Task created

  /api/tasks/{id}:
    get:
      summary: Get task details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
    patch:
      summary: Update task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task updated
    delete:
      summary: Remove task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task removed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
