openapi: 3.0.3
info:
  title: CollabBoard API
  description: >
    RESTful API specification for CollabBoard collaborative workspace and task management.
    Built for Session 2 Server-Side Technology workshop and assignment.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local Development Server

paths:
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                  timestamp:
                    type: string

  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@nsbm.lk
                password:
                  type: string
                  minLength: 6
                  example: password123
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /api/auth/login:
    post:
      summary: User authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user1@nsbm.lk
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login successful, returns JWT token and user profile
        '401':
          description: Invalid email or password
        '429':
          description: Too many login attempts

  /api/auth/me:
    get:
      summary: Get currently authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
        '401':
          description: Missing, invalid, or expired token

  /api/boards:
    get:
      summary: List boards accessible to requesting user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of accessible boards
    post:
      summary: Create a new board
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 3
                description:
                  type: string
                members:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Board created

  /api/boards/{id}:
    get:
      summary: Get specific board details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Board details
        '403':
          description: Forbidden access
        '404':
          description: Board not found
    patch:
      summary: Update board
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Board updated
    delete:
      summary: Delete board (Owner only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Board deleted

  /api/boards/{id}/analytics:
    get:
      summary: Get board analytics (aggregation pipeline)
      description: >
        Returns aggregated task statistics for a board computed in a **single
        MongoDB round-trip** using a `$facet` aggregation pipeline.
        No application-level looping is performed.

        **Answers two real analytical questions:**

        1. *"How many tasks per assignee are overdue on this board?"*
           — returned in `overduePerAssignee`, each entry includes the
           `overdueCount`, the affected `taskIds`, and a joined `assignee`
           object populated from the `users` collection via `$lookup`.

        2. *"What is the distribution of tasks by status and priority?"*
           — returned in `byStatus` and `byPriority` arrays.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Board ID
          schema:
            type: string
      responses:
        '200':
          description: Aggregated analytics data (single DB round-trip)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      boardId:
                        type: string
                        example: b1
                      generatedAt:
                        type: string
                        format: date-time
                        description: ISO timestamp of when the aggregation ran
                      totalTasks:
                        type: integer
                        example: 12
                        description: Total number of tasks on the board
                      totalOverdue:
                        type: integer
                        example: 3
                        description: Number of non-done tasks past their due date
                      overduePerAssignee:
                        type: array
                        description: >
                          One entry per assignee who has at least one overdue task,
                          sorted by overdueCount descending.
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              description: Assignee user ID
                              example: "2"
                            overdueCount:
                              type: integer
                              example: 2
                            taskIds:
                              type: array
                              items:
                                type: string
                              example: [t2, t7]
                            assignee:
                              type: object
                              description: >
                                Joined user document (populated via $lookup from
                                the users collection). Null when the assignee id
                                does not match any user.
                              properties:
                                _id:
                                  type: string
                                name:
                                  type: string
                                  example: Clara Tanaka
                                email:
                                  type: string
                                  format: email
                                  example: user2@nsbm.lk
                      byStatus:
                        type: array
                        description: Task counts grouped by status, sorted by count descending
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              enum: [todo, doing, in-progress, done]
                            count:
                              type: integer
                        example:
                          - { _id: todo, count: 5 }
                          - { _id: doing, count: 4 }
                          - { _id: done, count: 3 }
                      byPriority:
                        type: array
                        description: Task counts grouped by priority, sorted by count descending
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              enum: [low, normal, medium, high, urgent]
                            count:
                              type: integer
                        example:
                          - { _id: high, count: 6 }
                          - { _id: normal, count: 4 }
                          - { _id: low, count: 2 }
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Forbidden — user is not a member or owner of this board
        '404':
          description: Board not found

  /api/boards/{id}/tasks:
    get:
      summary: List tasks on a board
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, doing, done]
      responses:
        '200':
          description: List of tasks on board

  /api/tasks:
    get:
      summary: List and query tasks across accessible boards
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, doing, done]
        - name: assignee
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: -createdAt
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Filtered, sorted, and paginated task list
    post:
      summary: Create a new task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, boardId]
              properties:
                title:
                  type: string
                  minLength: 3
                boardId:
                  type: string
                status:
                  type: string
                  enum: [todo, doing, done]
                priority:
                  type: string
                  enum: [low, normal, high]
                assignee:
                  type: string
      responses:
        '201':
          description: Task created

  /api/tasks/{id}:
    get:
      summary: Get task details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
    patch:
      summary: Update task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task updated
    delete:
      summary: Remove task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task removed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
