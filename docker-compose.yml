services:
  server:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      additional_contexts:
        docs: ./docs
    restart: unless-stopped
    env_file:
      - ./Backend/.env

  client:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - server

