services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/collabboard
      MONGODB_URI: mongodb://mongo:27017/collabboard
      JWT_SECRET: ${JWT_SECRET:-fullstack-development-secret}
      CLIENT_ORIGIN: http://localhost:9090
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "9090:80"
    depends_on:
      - server

volumes:
  mongodata:
